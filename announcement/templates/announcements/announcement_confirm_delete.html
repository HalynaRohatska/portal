{% extends "base.html" %}

{% block title %}Видалення оголошення{% endblock %}

{% block content %}
<h1 class="h4 mb-4">Видалити оголошення?</h1>
<p>
    Ви впевнені, що хочете видалити оголошення
    "<strong>{{ object.title }}</strong>"? Цю дію неможливо скасувати.
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Так, видалити</button>
    <a href="{% url 'announcements:detail' object.pk %}" class="btn btn-outline-secondary">
        Скасувати
    </a>
</form>
{% endblock %}
